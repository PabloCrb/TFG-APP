@if (report?.data) {
  <div class="report-container">
    <!-- 📊 GRÁFICA GASTOS -->
    @if (expensesChartData) {
      <div class="chart-container">
        <h3>Gastos por categoría</h3>
        <canvas baseChart [data]="expensesChartData" [type]="'bar'"></canvas>
      </div>
    }

    <!-- 📊 GRÁFICA INGRESOS -->
    @if (incomeChartData) {
      <div class="chart-container">
        <h3>Ingresos por categoría</h3>
        <canvas baseChart [data]="incomeChartData" [type]="'bar'"></canvas>
      </div>
    }

    <!-- 🧠 INSIGHTS -->
    @if (insights.length) {
      <div class="insights">
        <h3>🧠 Insights</h3>

        @for (insight of insights; track insight) {
          <div class="insight">
            {{ insight }}
          </div>
        }
      </div>
    }
  </div>
}
